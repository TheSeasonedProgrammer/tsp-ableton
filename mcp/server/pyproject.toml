[project]
name = "tsp-mcp-for-ableton-live"
version = "0.1.3"
description = "TSP MCP for Ableton Live: control Ableton Live from Claude and other MCP clients"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "jsonschema>=4.20,<5",
    "zstandard>=0.23 ; python_full_version < '3.14'",
]

[project.scripts]
tsp-mcp-for-ableton-live = "tsp_mcp_for_ableton_live.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[project.urls]
Homepage = "https://github.com/TheSeasonedProgrammer/tsp-ableton"
Repository = "https://github.com/TheSeasonedProgrammer/tsp-ableton"
Issues = "https://github.com/TheSeasonedProgrammer/tsp-ableton/issues"
