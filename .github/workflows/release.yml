name: Release

# Publishing a GitHub release tagged vX.Y.Z uploads tsp-mcp-for-ableton-live X.Y.Z
# to PyPI. The tag must match the version in mcp/server/pyproject.toml.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(uv version --short)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG doesn't match pyproject.toml version $version (expected v$version)"
            exit 1
          fi
      - name: Build
        run: uv build --out-dir dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: mcp/server/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tsp-mcp-for-ableton-live/
    permissions:
      id-token: write  # PyPI trusted publishing, no API token needed
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*
